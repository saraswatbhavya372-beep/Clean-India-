  <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clean India Admin Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #166534;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .report {
            border-left: 5px solid #16a34a;
            margin-top: 15px;
        }

        .pending {
            color: #d97706;
            font-weight: bold;
        }

        .resolved {
            color: #16a34a;
            font-weight: bold;
        }

        .rejected {
            color: #dc2626;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        #dashboard {
            display: none;
        }

        /* COUNTERS */

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .stat {
            background: #f5f7f6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat h3 {
            font-size: 28px;
            margin: 5px;
        }

        .stat p {
            margin: 5px;
        }

        /* SEARCH */

        #searchBox {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* ACTION BUTTONS */

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .actions button {
            flex: 1;
            min-width: 100px;
        }

        .rejectButton {
            background: #dc2626;
        }

        .rejectButton:hover {
            background: #b91c1c;
        }

        .deleteButton {
            background: #7f1d1d;
        }

        .deleteButton:hover {
            background: #450a0a;
        }

    </style>
</head>

<body>

    <h1>🇮🇳 Clean India</h1>


    <!-- LOGIN -->

    <div id="loginBox" class="box">

        <h2>🔐 Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>

    </div>


    <!-- ADMIN DASHBOARD -->

    <div id="dashboard">

        <div class="box">

            <h2>📊 Admin Dashboard</h2>

            <p>
                Welcome, Admin! 👋
            </p>

            <button onclick="logout()">Logout</button>

        </div>


        <!-- STATISTICS -->

        <div class="box">

            <h2>📊 Report Statistics</h2>

            <div class="stats">

                <div class="stat">
                    <h3 id="totalCount">0</h3>
                    <p>📋 Total</p>
                </div>

                <div class="stat">
                    <h3 id="pendingCount">0</h3>
                    <p>🟠 Pending</p>
                </div>

                <div class="stat">
                    <h3 id="resolvedCount">0</h3>
                    <p>🟢 Resolved</p>
                </div>

                <div class="stat">
                    <h3 id="rejectedCount">0</h3>
                    <p>🔴 Rejected</p>
                </div>

            </div>

        </div>


        <!-- REPORTS -->

        <div class="box">

            <h2>📋 Submitted Reports</h2>

            <input
                type="text"
                id="searchBox"
                placeholder="🔎 Search reports..."
                oninput="searchReports()"
            >

            <div id="reports">
                Loading reports... ⏳
            </div>

        </div>

    </div>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>


    <script>

        // =========================
        // FIREBASE CONFIGURATION
        // =========================

        const firebaseConfig = {

            apiKey:
                "AIzaSyAOnF8P0wDBnDk6EWSEUEJHHuO9MTfXgg8",

            authDomain:
                "clean-india-da788.firebaseapp.com",

            projectId:
                "clean-india-da788",

            storageBucket:
                "clean-india-da788.firebasestorage.app",

            messagingSenderId:
                "612973022697",

            appId:
                "1:612973022697:web:53d8345127195e4d81cf78",

            measurementId:
                "G-8K3BQDW288"
        };


        firebase.initializeApp(firebaseConfig);


        const db = firebase.firestore();

        const auth = firebase.auth();


        // Store all reports here

        let allReports = [];


        // =========================
        // LOGIN
        // =========================

        function login() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("loginMessage");


            if (!email || !password) {

                message.innerHTML =
                    "❌ Please enter email and password.";

                return;
            }


            auth.signInWithEmailAndPassword(
                email,
                password
            )

            .then(function() {

                message.innerHTML =
                    "✅ Login successful!";

            })

            .catch(function(error) {

                console.error(error);

                message.innerHTML =
                    "❌ Login failed: " + error.message;

            });

        }


        // =========================
        // CHECK LOGIN
        // =========================

        auth.onAuthStateChanged(function(user) {

            if (user) {

                document.getElementById("loginBox")
                    .style.display = "none";

                document.getElementById("dashboard")
                    .style.display = "block";

                loadReports();

            } else {

                document.getElementById("loginBox")
                    .style.display = "block";

                document.getElementById("dashboard")
                    .style.display = "none";

            }

        });


        // =========================
        // LOAD REPORTS
        // =========================

        function loadReports() {

            const reportsDiv =
                document.getElementById("reports");


            db.collection("reports")
                .orderBy("timestamp", "desc")
                .onSnapshot(function(snapshot) {

                    allReports = [];


                    snapshot.forEach(function(doc) {

                        const report = doc.data();


                        allReports.push({

                            id: doc.id,

                            ...report

                        });

                    });


                    updateCounters();


                    displayReports(allReports);


                }, function(error) {

                    console.error(error);


                    reportsDiv.innerHTML =
                        "<p class='error'>❌ Cannot load reports: "
                        + error.message +
                        "</p>";

                });

        }


        // =========================
        // UPDATE COUNTERS
        // =========================

        function updateCounters() {

            const total =
                allReports.length;


            const pending =
                allReports.filter(function(report) {

                    return report.status === "pending";

                }).length;


            const resolved =
                allReports.filter(function(report) {

                    return report.status === "resolved";

                }).length;


            const rejected =
                allReports.filter(function(report) {

                    return report.status === "rejected";

                }).length;


            document.getElementById("totalCount")
                .textContent = total;


            document.getElementById("pendingCount")
                .textContent = pending;


            document.getElementById("resolvedCount")
                .textContent = resolved;


            document.getElementById("rejectedCount")
                .textContent = rejected;

        }


        // =========================
        // DISPLAY REPORTS
        // =========================

        function displayReports(reports) {

            const reportsDiv =
                document.getElementById("reports");


            reportsDiv.innerHTML = "";


            if (reports.length === 0) {

                reportsDiv.innerHTML =
                    "<p>No reports found. 🔍</p>";

                return;

            }


            reports.forEach(function(report) {

                const div =
                    document.createElement("div");


                div.className =
                    "box report";


                const status =
                    report.status || "pending";


                let statusClass =
                    "pending";


                if (status === "resolved") {

                    statusClass = "resolved";

                }


                if (status === "rejected") {

                    statusClass = "rejected";

                }


                div.innerHTML = `

                    <h3>
                        🚨
                        ${escapeHTML(
                            report.name || "No name"
                        )}
                    </h3>


                    <p>

                        📍 <b>Location:</b><br>

                        ${escapeHTML(
                            report.location ||
                            "Not available"
                        )}

                    </p>


                    <p>

                        📝 <b>Description:</b><br>

                        ${escapeHTML(
                            report.description ||
                            "No description"
                        )}

                    </p>


                    <p class="${statusClass}">

                        Status:
                        ${escapeHTML(status)}

                    </p>


                    <div class="actions">

                        <button
                            onclick="updateStatus(
                                '${report.id}',
                                'resolved'
                            )">

                            ✅ Resolve

                        </button>


                        <button
                            class="rejectButton"
                            onclick="updateStatus(
                                '${report.id}',
                                'rejected'
                            )">

                            ❌ Reject

                        </button>


                        <button
                            class="deleteButton"
                            onclick="deleteReport(
                                '${report.id}'
                            )">

                            🗑️ Delete

                        </button>

                    </div>

                `;


                reportsDiv.appendChild(div);

            });

        }


        // =========================
        // SEARCH
        // =========================

        function searchReports() {

            const search =
                document.getElementById("searchBox")
                .value
                .toLowerCase()
                .trim();


            const filtered =
                allReports.filter(function(report) {

                    return (

                        (report.name || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        (report.location || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        (report.description || "")
                            .toLowerCase()
                            .includes(search)

                        ||

                        (report.status || "")
                            .toLowerCase()
                            .includes(search)

                    );

                });


            displayReports(filtered);

        }


        // =========================
        // UPDATE STATUS
        // =========================

        function updateStatus(id, newStatus) {

            db.collection("reports")
                .doc(id)
                .update({

                    status: newStatus

                })

                .then(function() {

                    if (newStatus === "resolved") {

                        alert(
                            "✅ Report marked as resolved!"
                        );

                    } else {

                        alert(
                            "❌ Report rejected!"
                        );

                    }

                })

                .catch(function(error) {

                    console.error(error);

                    alert(
                        "❌ Firebase Error:\n\n" +
                        error.message
                    );

                });

        }


        // =========================
        // DELETE REPORT
        // =========================

        function deleteReport(id) {

            const confirmDelete =
                confirm(
                    "⚠️ Are you sure you want to permanently delete this report?"
                );


            if (!confirmDelete) {

                return;

            }


            db.collection("reports")
                .doc(id)
                .delete()

                .then(function() {

                    alert(
                        "🗑️ Report deleted successfully!"
                    );

                })

                .catch(function(error) {

                    console.error(error);

                    alert(
                        "❌ Firebase Error:\n\n" +
                        error.message
                    );

                });

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            auth.signOut();

        }


        // =========================
        // SECURITY
        // =========================

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }

    </script>

</body>
</html>
