<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clean India Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #166534;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .report {
            border-left: 5px solid #16a34a;
            margin-top: 15px;
        }

        .pending {
            color: #d97706;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        #dashboard {
            display: none;
        }
    </style>
</head>

<body>

    <h1>🇮🇳 Clean India</h1>

    <!-- LOGIN -->
    <div id="loginBox" class="box">
        <h2>🔐 Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>
    </div>


    <!-- ADMIN DASHBOARD -->
    <div id="dashboard">

        <div class="box">
            <h2>📊 Admin Dashboard</h2>

            <p>
                Welcome, Admin! 👋
            </p>

            <button onclick="logout()">Logout</button>
        </div>

        <div class="box">
            <h2>📋 Submitted Reports</h2>

            <div id="reports">
                Loading reports... ⏳
            </div>
        </div>

    </div>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>


    <script>

        // Firebase Configuration
        const firebaseConfig = {

            apiKey:
                "AIzaSyAOnF8P0wDBnDk6EWSEUEJHHuO9MTfXgg8",

            authDomain:
                "clean-india-da788.firebaseapp.com",

            projectId:
                "clean-india-da788",

            storageBucket:
                "clean-india-da788.firebasestorage.app",

            messagingSenderId:
                "612973022697",

            appId:
                "1:612973022697:web:53d8345127195e4d81cf78",

            measurementId:
                "G-8K3BQDW288"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();
        const auth = firebase.auth();


        // LOGIN
        function login() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("loginMessage");

            if (!email || !password) {
                message.innerHTML =
                    "❌ Please enter email and password.";
                return;
            }

            auth.signInWithEmailAndPassword(email, password)

            .then(function() {

                message.innerHTML =
                    "✅ Login successful!";

            })

            .catch(function(error) {

                console.error(error);

                message.innerHTML =
                    "❌ Login failed: " + error.message;
            });
        }


        // CHECK LOGIN STATUS
        auth.onAuthStateChanged(function(user) {

            if (user) {

                document.getElementById("loginBox")
                    .style.display = "none";

                document.getElementById("dashboard")
                    .style.display = "block";

                loadReports();

            } else {

                document.getElementById("loginBox")
                    .style.display = "block";

                document.getElementById("dashboard")
                    .style.display = "none";
            }

        });


        // LOAD REPORTS
        function loadReports() {

            const reportsDiv =
                document.getElementById("reports");

            db.collection("reports")
                .orderBy("timestamp", "desc")
                .onSnapshot(function(snapshot) {

                    reportsDiv.innerHTML = "";

                    if (snapshot.empty) {

                        reportsDiv.innerHTML =
                            "<p>No reports submitted yet.</p>";

                        return;
                    }


                    snapshot.forEach(function(doc) {

                        const report = doc.data();

                        const div =
                            document.createElement("div");

                        div.className =
                            "box report";

                        div.innerHTML = `
                            <h3>🚨 ${escapeHTML(report.name || "No name")}</h3>

                            <p>
                                📍 <b>Location:</b>
                                ${escapeHTML(report.location || "Not available")}
                            </p>

                            <p>
                                📝 <b>Description:</b>
                                ${escapeHTML(report.description || "No description")}
                            </p>

                            <p class="pending">
                                Status:
                                ${escapeHTML(report.status || "pending")}
                            </p>
                        `;

                        reportsDiv.appendChild(div);

                    });

                }, function(error) {

                    reportsDiv.innerHTML =
                        "<p class='error'>❌ Cannot load reports: "
                        + error.message +
                        "</p>";

                });
        }


        // LOGOUT
        function logout() {

            auth.signOut();

        }


        // Prevent HTML injection from submitted text
        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>

</body>
</html>
